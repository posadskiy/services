<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset your password</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f1ec;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">Reset your password. This link expires in 1 hour.</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;background-color:#f4f1ec;">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:560px;background-color:#ffffff;border-radius:16px;">
          <tr>
            <td style="padding:36px 32px;font-family:Arial,Helvetica,sans-serif;color:#1c1917;text-align:left;">
              <p style="margin:0 0 12px;font-size:22px;line-height:1.3;font-weight:700;">Reset your password</p>
              <p style="margin:0 0 24px;font-size:16px;line-height:1.5;color:#44403c;">We received a request to reset your password.</p>
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" bgcolor="#1c1917" style="border-radius:8px;background-color:#1c1917;">
                    <a href="{{{RESET_URL}}}" style="display:inline-block;padding:12px 22px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.2;font-weight:700;color:#ffffff;text-decoration:none;">Reset password</a>
                  </td>
                </tr>
              </table>
              <p style="margin:24px 0 0;font-size:14px;line-height:1.5;color:#57534e;">This link expires in 1 hour. If you did not ask for a reset, you can ignore this message.</p>
              <p style="margin:16px 0 0;font-size:13px;line-height:1.5;color:#78716c;">If the button does not work, open this link:</p>
              <p style="margin:8px 0 0;font-size:13px;line-height:1.5;word-break:break-all;"><a href="{{{RESET_URL}}}" style="color:#1c1917;text-decoration:underline;">{{{RESET_URL}}}</a></p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
