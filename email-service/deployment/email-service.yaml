apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-service
  namespace: microservices
  labels:
    app: email-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: email-service
  template:
    metadata:
      labels:
        app: email-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/prometheus"
        prometheus.io/port: "8090"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: dockerhub-registry-secret
      containers:
        - name: email-service
          image: ${DOCKERHUB_USERNAME}/email-service:${IMAGE_VERSION}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 8090
          env:
            - name: MICRONAUT_ENVIRONMENTS
              value: "prod"
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: microservices-secrets
                  key: RESEND_API_KEY
            - name: RESEND_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: microservices-secrets
                  key: RESEND_WEBHOOK_SECRET
            - name: RESEND_ALLOWED_FROM
              valueFrom:
                secretKeyRef:
                  name: microservices-secrets
                  key: RESEND_ALLOWED_FROM
            - name: EMAIL_ALLOWED_LINK_ORIGINS
              value: "https://grammarbar.com,https://costy.posadskiy.com,https://repeaty.posadskiy.com"
            - name: OTEL_SERVICE_NAME
              value: "email-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://grafana-alloy.observability.svc.cluster.local:4317"
            - name: OTEL_TRACES_SAMPLER
              value: parentbased_traceidratio
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          startupProbe:
            httpGet:
              path: /health/liveness
              port: 8090
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 8090
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 8090
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: email-service
  namespace: microservices
  labels:
    app: email-service
spec:
  type: ClusterIP
  ports:
    - port: 8090
      targetPort: 8090
      protocol: TCP
  selector:
    app: email-service 
