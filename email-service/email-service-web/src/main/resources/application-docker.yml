#tag::micronaut[]
micronaut:
  security:
    intercept-url-map:
      - pattern: /health
        access: isAnonymous()
    token:
      jwt:
        signatures:
          secret:
            generator:
              secret: "${JWT_GENERATOR_SIGNATURE_SECRET}"
        claims-validators:
          issuer: ${AUTH_JWT_ISSUER:`https://auth.posadskiy.com`}
          audience: ${AUTH_JWT_AUDIENCE:api.posadskiy.com}
  endpoints:
    health:
      enabled: true
      sensitive: false
      details:
        enabled: true
#end::micronaut[]

#tag::otel[]
otel:
  traces:
    sampler:
      arg: ${OTEL_TRACES_SAMPLER_ARG:1.0}
#end::otel[]

