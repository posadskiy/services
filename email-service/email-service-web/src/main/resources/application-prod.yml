#tag::micronaut[]
micronaut:
  security:
    intercept-url-map:
      - pattern: /v3/api-docs/**
        access: isAnonymous()
      - pattern: /health
        access: isAnonymous()
      - pattern: /health/liveness
        access: isAnonymous()
      - pattern: /health/readiness
        access: isAnonymous()
      - pattern: /prometheus
        access: isAnonymous()
      - pattern: /email/webhooks/resend
        access: isAnonymous()
    token:
      jwt:
        claims-validators:
          issuer: ${AUTH_JWT_ISSUER:`https://auth.posadskiy.com`}
          audience: ${AUTH_JWT_AUDIENCE:api.posadskiy.com}
  endpoints:
    health:
      enabled: true
      sensitive: false
      details:
        enabled: false
#end::micronaut[]

#tag::otel[]
otel:
  traces:
    sampler:
      arg: ${OTEL_TRACES_SAMPLER_ARG:0.1}
#end::otel[]
