#tag::micronaut[]
micronaut:
  server:
    cors:
      enabled: true
      configurations:
        ui:
          allowed-origins:
            - http://localhost:3000
          allowed-methods: GET,POST,PUT,DELETE,OPTIONS
          allowed-headers: "*"
          allow-credentials: true
  security:
    intercept-url-map:
      - pattern: /v3/api-docs/**
        access: isAnonymous()
      - pattern: /health
        access: isAnonymous()
    token:
      jwt:
        signatures:
          secret:
            generator:
              secret: "${JWT_GENERATOR_SIGNATURE_SECRET}"
        claims-validators:
          issuer: ${AUTH_JWT_ISSUER:`https://auth.posadskiy.com`}
          audience: ${AUTH_JWT_AUDIENCE:api.posadskiy.com}
  endpoints:
    health:
      enabled: true
      sensitive: false
      details:
        enabled: true
#end::micronaut[]

#tag::otel[]
otel:
  traces:
    sampler:
      arg: ${OTEL_TRACES_SAMPLER_ARG:1.0}
#end::otel[]

#tag::logging[]
logging:
  level:
    com.posadskiy.email: ${LOG_LEVEL_APP:DEBUG}
    io.micronaut: ${LOG_LEVEL_MICRONAUT:INFO}
#end::logging[]
