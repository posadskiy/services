name: email-template-service

services:
  web:
    init: true
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN:-}
        GITHUB_USERNAME: ${GITHUB_USERNAME:-}
    environment:
      MICRONAUT_ENVIRONMENTS: dev
      JWT_GENERATOR_SIGNATURE_SECRET: ${JWT_GENERATOR_SIGNATURE_SECRET:?Set JWT_GENERATOR_SIGNATURE_SECRET}
      OTEL_SERVICE_NAME: email-template-service
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4317}
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      USER_SERVICE_URL: http://host.docker.internal:8095
      EMAIL_SERVICE_URL: http://host.docker.internal:8090
    ports:
      - "127.0.0.1:8091:8091"
      - "127.0.0.1:5008:5008"
    labels:
      logging: promtail
      service: email-template-service
