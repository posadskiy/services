apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cors-middleware
  namespace: microservices
spec:
  headers:
    accessControlAllowMethods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    accessControlAllowHeaders:
      - DNT
      - User-Agent
      - X-Requested-With
      - If-Modified-Since
      - Cache-Control
      - Content-Type
      - Range
      - Authorization
      # W3C trace context, so browser traces (Grafana Faro) continue into auth/user/email.
      - traceparent
      - tracestate
      - baggage
    accessControlExposeHeaders:
      - Content-Length
      - Content-Range
    accessControlAllowCredentials: true
    accessControlAllowOriginList:
      - https://repeaty.posadskiy.com
      - https://costy.posadskiy.com
      - https://grammarbar.com
      - https://grammarbar.posadskiy.com
      # iOS app (Capacitor)
      - capacitor://localhost
    accessControlMaxAge: 1728000
    customRequestHeaders:
      X-Forwarded-Proto: https

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit-middleware
  namespace: microservices
spec:
  rateLimit:
    average: 100
    period: 1s
    burst: 50

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-prefix-auth
  namespace: microservices
spec:
  stripPrefix:
    prefixes:
      - /auth

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-prefix-user
  namespace: microservices
spec:
  stripPrefix:
    prefixes:
      - /user
