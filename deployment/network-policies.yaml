# Who may open connections to the service pods. Outbound traffic is not restricted.
#
# Allowed callers: other pods in this namespace (auth <-> user/email, JWKS and mail), Traefik in kube-system
# (public routes), the observability namespace (metrics scrape), and costy plus grammarbar on the auth and
# user ports (they verify access tokens and profile-service reads the user API). Anything else is refused.
#
# Check the namespace names against your cluster before applying:
#   kubectl get ns --show-labels
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: services-ingress
  namespace: microservices
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: costy
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: grammarbar
      ports:
        - protocol: TCP
          port: 8100
        - protocol: TCP
          port: 8095
