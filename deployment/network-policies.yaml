# Who may open connections to the service pods. Outbound traffic is not restricted.
#
# Allowed callers: other pods in this namespace (auth <-> user/email, JWKS and mail), Traefik in kube-system
# (public routes), and the observability namespace (metrics scrape). Anything else in the cluster is refused.
#
# Check the namespace names against your cluster before applying:
#   kubectl get ns --show-labels
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: services-ingress
  namespace: microservices
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
