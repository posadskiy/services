apiVersion: v1
kind: Secret
metadata:
  name: microservices-secrets
  namespace: microservices
type: Opaque
stringData:
  AUTH_DATABASE_PASSWORD: "${AUTH_DATABASE_PASSWORD_PROD}"
  JWT_GENERATOR_SIGNATURE_SECRET: "${JWT_GENERATOR_SIGNATURE_SECRET}"
  AUTH_JWT_PRIVATE_KEY_PEM: "${AUTH_JWT_PRIVATE_KEY_PEM}"
  AUTH_JWT_PUBLIC_KEY_PEM: "${AUTH_JWT_PUBLIC_KEY_PEM}"
  SYSTEM_CLIENT_ID: "${SYSTEM_CLIENT_ID}"
  SYSTEM_CLIENT_SECRET: "${SYSTEM_CLIENT_SECRET}"
  AUTH_TURNSTILE_SECRET: "${AUTH_TURNSTILE_SECRET}"
  OAUTH_TOKEN_ENCRYPTION_SECRET_PROD: "${OAUTH_TOKEN_ENCRYPTION_SECRET_PROD}"
  GOOGLE_OAUTH_CLIENT_ID: "${GOOGLE_OAUTH_CLIENT_ID}"
  GOOGLE_OAUTH_CLIENT_SECRET: "${GOOGLE_OAUTH_CLIENT_SECRET}"
  GITHUB_OAUTH_CLIENT_ID: "${GITHUB_OAUTH_CLIENT_ID}"
  GITHUB_OAUTH_CLIENT_SECRET: "${GITHUB_OAUTH_CLIENT_SECRET}"
  FACEBOOK_OAUTH_CLIENT_ID: "${FACEBOOK_OAUTH_CLIENT_ID}"
  FACEBOOK_OAUTH_CLIENT_SECRET: "${FACEBOOK_OAUTH_CLIENT_SECRET}"
  AUTH_EMAIL_FROM_GRAMMARBAR: "${AUTH_EMAIL_FROM_GRAMMARBAR}"
  AUTH_EMAIL_FROM_POSADSKIY: "${AUTH_EMAIL_FROM_POSADSKIY}"
  RESEND_API_KEY: "${RESEND_API_KEY}"
  RESEND_ALLOWED_FROM: "${RESEND_ALLOWED_FROM}"
