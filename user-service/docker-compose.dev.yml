# User service alone. Postgres is the one published by the shared stack on the host.

name: user-service

services:
  web:
    init: true
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN:-}
        GITHUB_USERNAME: ${GITHUB_USERNAME:-}
    environment:
      MICRONAUT_ENVIRONMENTS: docker
      DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/${AUTH_DATABASE_NAME:-auth_db}
      DATASOURCE_USERNAME: ${AUTH_DATABASE_USER:?Set AUTH_DATABASE_USER}
      DATASOURCE_PASSWORD: ${AUTH_DATABASE_PASSWORD:?Set AUTH_DATABASE_PASSWORD}
      JWT_GENERATOR_SIGNATURE_SECRET: ${JWT_GENERATOR_SIGNATURE_SECRET:?Set JWT_GENERATOR_SIGNATURE_SECRET}
      OTEL_SERVICE_NAME: user-service
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4317}
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "1.0"
    ports:
      - "127.0.0.1:8095:8095"
      - "127.0.0.1:5006:5006"
    labels:
      logging: promtail
      service: user-service
