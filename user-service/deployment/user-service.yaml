apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: microservices
  labels:
    app: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/prometheus"
        prometheus.io/port: "8095"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: dockerhub-registry-secret
      containers:
        - name: user-service
          image: ${DOCKERHUB_USERNAME}/user-service:${IMAGE_VERSION}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 8095
          env:
            - name: MICRONAUT_ENVIRONMENTS
              value: "prod"
            - name: DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: microservices-config
                  key: AUTH_DATABASE_URL
            - name: DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: microservices-config
                  key: AUTH_DATABASE_USER
            - name: DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: microservices-secrets
                  key: AUTH_DATABASE_PASSWORD
            - name: OTEL_SERVICE_NAME
              value: "user-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://grafana-alloy.observability.svc.cluster.local:4317"
            - name: OTEL_TRACES_SAMPLER
              value: parentbased_traceidratio
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            - name: DB_MAX_POOL_SIZE
              value: "3"
            - name: DB_MIN_IDLE
              value: "0"
            - name: DB_IDLE_TIMEOUT
              value: "60000"
            - name: DB_MAX_LIFETIME
              value: "600000"
            - name: DATASOURCES_DEFAULT_HIKARI_MAXIMUM_POOL_SIZE
              value: "3"
            - name: DATASOURCES_DEFAULT_HIKARI_MINIMUM_IDLE
              value: "0"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          startupProbe:
            httpGet:
              path: /health/liveness
              port: 8095
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 8095
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 8095
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: microservices
  labels:
    app: user-service
spec:
  type: ClusterIP
  ports:
    - port: 8095
      targetPort: 8095
      protocol: TCP
  selector:
    app: user-service
---
apiVersion: v1
kind: Service
metadata:
  name: user-service-external
  namespace: microservices
  labels:
    app: user-service-external
spec:
  type: ExternalName
  externalName: user-service.microservices.svc.cluster.local
  ports:
    - port: 8095
      protocol: TCP 
