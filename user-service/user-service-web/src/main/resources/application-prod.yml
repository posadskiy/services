#tag::micronaut[]
micronaut:
  security:
    intercept-url-map:
      - pattern: /v3/api-docs/**
        access: isAnonymous()
      - pattern: /health
        access: isAnonymous()
      - pattern: /health/liveness
        access: isAnonymous()
      - pattern: /health/readiness
        access: isAnonymous()
      - pattern: /prometheus
        access: isAnonymous()
    token:
      jwt:
        claims-validators:
          issuer: ${AUTH_JWT_ISSUER:`https://auth.posadskiy.com`}
          audience: ${AUTH_JWT_AUDIENCE:api.posadskiy.com}
  endpoints:
    health:
      enabled: true
      sensitive: false
      details:
        enabled: false
#end::micronaut[]

#tag::database[]
# Hikari properties must be under datasources.default (not .hikari) per Micronaut JDBC config
datasources:
  default:
    maximum-pool-size: ${DB_MAX_POOL_SIZE:3}
    minimum-idle: ${DB_MIN_IDLE:0}
    connection-timeout: ${DB_CONNECTION_TIMEOUT:10000}
    idle-timeout: ${DB_IDLE_TIMEOUT:60000}
    max-lifetime: ${DB_MAX_LIFETIME:600000}
    leak-detection-threshold: 60000
flyway:
  datasources:
    default:
      validate-on-migrate: true
#end::database[]

#tag::otel[]
otel:
  traces:
    sampler:
      arg: ${OTEL_TRACES_SAMPLER_ARG:0.1}
#end::otel[]
