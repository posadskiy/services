name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MAVEN_VERSION: "3.9.12"

jobs:
  test:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - user-service
          - email-service
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/**/pom.xml

      - name: Install Maven
        working-directory: ${{ github.workspace }}
        run: |
          curl -fsSL "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/${MAVEN_VERSION}/apache-maven-${MAVEN_VERSION}-bin.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Maven settings
        env:
          MAVEN_USER: ${{ github.repository_owner }}
          MAVEN_TOKEN: ${{ secrets.DEPLOYMENT_GITHUB_TOKEN }}
        run: |
          mkdir -p "$HOME/.m2"
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<settings>' \
            '  <servers>' \
            '    <server>' \
            '      <id>github</id>' \
            "      <username>${MAVEN_USER}</username>" \
            "      <password>${MAVEN_TOKEN}</password>" \
            '    </server>' \
            '  </servers>' \
            '</settings>' > "$HOME/.m2/settings.xml"

      - name: Install local user-service-api
        if: matrix.service == 'email-service'
        working-directory: user-service
        run: mvn -B install -pl user-service-api -am -DskipTests

      - name: Test
        run: mvn -B install
