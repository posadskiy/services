name: Release

on:
  push:
    tags:
      - "auth-service/v*"
      - "user-service/v*"
      - "email-service/v*"
      - "email-template-service/v*"

permissions:
  contents: write

env:
  MAVEN_VERSION: "3.9.12"

jobs:
  release:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: release
        run: |
          ref="${GITHUB_REF#refs/tags/}"
          case "$ref" in
            email-template-service/v*)
              service=email-template-service
              version="${ref#email-template-service/v}"
              ;;
            email-service/v*)
              service=email-service
              version="${ref#email-service/v}"
              ;;
            user-service/v*)
              service=user-service
              version="${ref#user-service/v}"
              ;;
            auth-service/v*)
              service=auth-service
              version="${ref#auth-service/v}"
              ;;
            *)
              echo "Unsupported tag: $ref" >&2
              exit 1
              ;;
          esac
          echo "service=$service" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
          cache-dependency-path: ${{ steps.release.outputs.service }}/**/pom.xml

      - name: Install Maven
        run: |
          curl -fsSL "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/${MAVEN_VERSION}/apache-maven-${MAVEN_VERSION}-bin.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Maven settings
        env:
          MAVEN_USER: ${{ github.repository_owner }}
          MAVEN_TOKEN: ${{ secrets.DEPLOYMENT_GITHUB_TOKEN }}
        run: |
          mkdir -p "$HOME/.m2"
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<settings>' \
            '  <servers>' \
            '    <server>' \
            '      <id>github</id>' \
            "      <username>${MAVEN_USER}</username>" \
            "      <password>${MAVEN_TOKEN}</password>" \
            '    </server>' \
            '  </servers>' \
            '</settings>' > "$HOME/.m2/settings.xml"

      - name: Check tag matches pom version
        working-directory: ${{ steps.release.outputs.service }}
        run: |
          pom=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout | tail -n 1)
          if [ "$pom" != "${{ steps.release.outputs.version }}" ]; then
            echo "pom version '$pom' does not match tag version '${{ steps.release.outputs.version }}'" >&2
            exit 1
          fi

      - name: Test
        working-directory: ${{ steps.release.outputs.service }}
        run: mvn -B install

      - name: Publish Maven packages
        working-directory: ${{ steps.release.outputs.service }}
        run: mvn -B deploy -DskipTests

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        working-directory: ${{ steps.release.outputs.service }}
        env:
          GITHUB_TOKEN: ${{ secrets.DEPLOYMENT_GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          image="$DOCKERHUB_USERNAME/$(basename "$PWD")"
          docker buildx build --platform linux/arm64 \
            --build-arg GITHUB_TOKEN \
            --build-arg GITHUB_USERNAME \
            -f Dockerfile.prod \
            -t "$image:$VERSION" \
            -t "$image:latest" \
            . --push

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" \
            --title "${{ steps.release.outputs.service }} ${{ steps.release.outputs.version }}" \
            --notes "Docker Hub image ${DOCKERHUB_USERNAME}/${{ steps.release.outputs.service }}:${{ steps.release.outputs.version }}"
