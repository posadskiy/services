version: 2
updates:
  - package-ecosystem: maven
    directories:
      - "/auth-service"
      - "/user-service"
      - "/email-service"
      - "/email-template-service"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - "/auth-service"
      - "/user-service"
      - "/email-service"
      - "/email-template-service"
    schedule:
      interval: weekly
