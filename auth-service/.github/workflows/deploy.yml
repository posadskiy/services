name: Deploy to Production

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (optional, defaults to latest tag)'
        required: false
        type: string

env:
  JAVA_VERSION: '25'
  IMAGE_NAME: 'auth-service'

jobs:
  quality-assurance:
    name: Quality Assurance
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-java@v6
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'maven'
    - name: Test
      run: ./mvnw -B install

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: quality-assurance
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      trigger_type: ${{ steps.version.outputs.trigger_type }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v6
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'maven'
    - name: Calculate Version
      id: version
      run: |
        if [[ "${{ github.event_name }}" == "push" ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
          TAG="v$VERSION"
          TRIGGER_TYPE="tag"
        else
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(git describe --tags --abbrev=0 | sed 's/^v//')
          fi
          TAG="v$VERSION"
          TRIGGER_TYPE="manual"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "trigger_type=$TRIGGER_TYPE" >> $GITHUB_OUTPUT
    - uses: docker/setup-buildx-action@v4
    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Build and push
      env:
        GITHUB_TOKEN: ${{ secrets.DEPLOYMENT_GITHUB_TOKEN }}
        GITHUB_USERNAME: posadskiy
      run: |
        IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"
        docker buildx build --platform linux/amd64 \
          --build-arg GITHUB_TOKEN=${{ secrets.DEPLOYMENT_GITHUB_TOKEN }} \
          --build-arg GITHUB_USERNAME=posadskiy \
          -f Dockerfile.prod \
          -t "$IMAGE" \
          . --push

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [quality-assurance, build]
    environment: production
    steps:
    - uses: actions/checkout@v4
    - uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
    - uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: ${{ secrets.GKE_CLUSTER_NAME }}
        location: ${{ secrets.GKE_REGION }}
        project_id: ${{ secrets.GCP_PROJECT_ID }}
    - name: Deploy
      run: |
        NAMESPACE="${{ secrets.K8S_NAMESPACE || 'microservices' }}"
        export IMAGE_VERSION="${{ needs.build.outputs.version }}"
        export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
        envsubst < deployment/auth-service.yaml | kubectl apply -f -
        kubectl wait --for=condition=available --timeout=300s deployment/auth-service -n "$NAMESPACE"
    - name: Create Release
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ secrets.DEPLOYMENT_GITHUB_TOKEN }}
      run: |
        gh release create ${{ needs.build.outputs.tag }} \
          --title "Auth Service ${{ needs.build.outputs.version }}" \
          --notes "Production image ${{ secrets.DOCKERHUB_USERNAME }}/auth-service:${{ needs.build.outputs.version }}"
