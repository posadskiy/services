micronaut:
  server:
    cors:
      enabled: true
      configurations:
        webapp:
          allowed-origins:
            - http://localhost:3000
          allowed-methods:
            - GET
            - POST
            - OPTIONS
            - PUT
            - DELETE
          allowed-headers:
            - Content-Type
            - Authorization
          allow-credentials: true
  endpoints:
    health:
      enabled: true
      sensitive: false
      details:
        enabled: true

datasources:
  default:
    url: ${DATASOURCE_URL:`jdbc:postgresql://auth-db:5432/auth_db`}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
    minimum-idle: ${DB_MIN_IDLE:5}

flyway:
  datasources:
    default:
      validate-on-migrate: true

auth:
  oauth:
    redirect-base-url: http://localhost:8100
