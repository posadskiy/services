micronaut:
  server:
    cors:
      enabled: true
      configurations:
        ui:
          allowed-origins:
            - http://localhost:3000
          allowed-methods:
            - GET
            - POST
            - OPTIONS
            - PUT
            - DELETE
          allowed-headers:
            - Content-Type
            - Authorization
          allow-credentials: true
  endpoints:
    health:
      details:
        enabled: true

datasources:
  default:
    url: ${DATASOURCE_URL:`jdbc:postgresql://localhost:5432/auth_db`}
    username: ${DATASOURCE_USERNAME:auth_user}
    password: ${DATASOURCE_PASSWORD:auth_password}
    maximum-pool-size: ${DB_MAX_POOL_SIZE:5}
    minimum-idle: ${DB_MIN_IDLE:2}

otel:
  traces:
    sampler:
      arg: ${OTEL_TRACES_SAMPLER_ARG:1.0}

auth:
  oauth:
    redirect-base-url: http://localhost:8100
    frontend-redirect-url: ${OAUTH_FRONTEND_REDIRECT_URL:http://localhost:3000/oauth/callback}
    providers:
      google:
        redirect-uri: http://localhost:8100/oauth2/callback/google
      apple:
        redirect-uri: http://localhost:8100/oauth2/callback/apple
