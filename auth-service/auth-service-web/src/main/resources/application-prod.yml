micronaut:
  security:
    intercept-url-map:
      - pattern: /login
        access: isAnonymous()
      - pattern: /users
        access: isAnonymous()
      - pattern: /signup
        access: isAnonymous()
      - pattern: /account/verify
        access: isAnonymous()
      - pattern: /account/forgot-password
        access: isAnonymous()
      - pattern: /account/reset-password
        access: isAnonymous()
      - pattern: /oauth/token
        access: isAnonymous()
      - pattern: /oauth/revoke
        access: isAnonymous()
      - pattern: /logout
        access: isAnonymous()
      - pattern: /oauth2/**
        access: isAnonymous()
      - pattern: /keys
        access: isAnonymous()
      - pattern: /.well-known/**
        access: isAnonymous()
      - pattern: /prometheus
        access: isAnonymous()
      - pattern: /health/liveness
        access: isAnonymous()
      - pattern: /health/readiness
        access: isAnonymous()
  endpoints:
    health:
      enabled: true
      sensitive: false
      details:
        enabled: false
    openapi:
      enabled: false
  router:
    static-resources:
      swagger:
        enabled: false
      swagger-ui:
        enabled: false

datasources:
  default:
    maximum-pool-size: ${DB_MAX_POOL_SIZE:3}
    minimum-idle: ${DB_MIN_IDLE:0}
    connection-timeout: ${DB_CONNECTION_TIMEOUT:10000}
    idle-timeout: ${DB_IDLE_TIMEOUT:60000}
    max-lifetime: ${DB_MAX_LIFETIME:600000}
    leak-detection-threshold: 60000

flyway:
  datasources:
    default:
      validate-on-migrate: true

otel:
  traces:
    sampler:
      arg: ${OTEL_TRACES_SAMPLER_ARG:0.1}

auth:
  oauth:
    redirect-base-url: ${OAUTH_REDIRECT_BASE_URL}
    frontend-redirect-url: ${OAUTH_FRONTEND_REDIRECT_URL:}
    allowed-frontend-redirect-urls: ${OAUTH_ALLOWED_FRONTEND_REDIRECT_URLS:}
    providers:
      google:
        redirect-uri: ${OAUTH_REDIRECT_BASE_URL}/oauth2/callback/google
      apple:
        redirect-uri: ${OAUTH_REDIRECT_BASE_URL}/oauth2/callback/apple
