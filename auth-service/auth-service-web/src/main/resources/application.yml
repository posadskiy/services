micronaut:
  application:
    name: auth-service
  server:
    port: 8100
    thread-selection: AUTO
    cors:
      enabled: false
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger/swagger/
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**
  security:
    authentication: bearer
    intercept-url-map:
      - pattern: /swagger-ui/**
        access: isAnonymous()
      - pattern: /swagger/**
        access: isAnonymous()
      - pattern: /login
        access: isAnonymous()
      - pattern: /users
        access: isAnonymous()
      - pattern: /oauth/token
        access: isAnonymous()
      - pattern: /oauth/revoke
        access: isAnonymous()
      - pattern: /logout
        access: isAnonymous()
      - pattern: /oauth2/**
        access: isAnonymous()
      - pattern: /keys
        access: isAnonymous()
      - pattern: /.well-known/**
        access: isAnonymous()
      - pattern: /prometheus
        access: isAnonymous()
      - pattern: /health
        access: isAnonymous()
      - pattern: /health/liveness
        access: isAnonymous()
      - pattern: /health/readiness
        access: isAnonymous()
    endpoints:
      login:
        enabled: false
      logout:
        enabled: false
      oauth:
        enabled: false
      keys:
        enabled: true
        path: /keys
    token:
      jwt:
        claims-validators:
          issuer: ${AUTH_JWT_ISSUER:https://auth.posadskiy.com}
          audience: ${AUTH_JWT_AUDIENCE:api.posadskiy.com}
          not-before: true
        generator:
          access-token:
            expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900}
          refresh-token:
            enabled: false
  metrics:
    enabled: true
    export:
      prometheus:
        enabled: true
        descriptions: true
        step: ${METRICS_STEP:1m}
  tracing:
    opentelemetry:
      enabled: true
  endpoints:
    prometheus:
      enabled: true
      sensitive: false
    health:
      enabled: true
      sensitive: false
      details:
        enabled: false
    openapi:
      enabled: true
      sensitive: false
  http:
    services:
      oauth-providers:
        read-timeout: 10s
        connect-timeout: 5s
        follow-redirects: false
    client:
      read-timeout: 10s
      connect-timeout: 5s
      follow-redirects: false
  lifecycle:
    graceful-shutdown:
      enabled: true

datasources:
  default:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    schema-generate: NONE
    dialect: POSTGRES

flyway:
  datasources:
    default:
      enabled: true
      baseline-on-migrate: false

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
      protocol: grpc
  traces:
    exporter: otlp
    sampler:
      arg: ${OTEL_TRACES_SAMPLER_ARG:1.0}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.posadskiy.auth: ${LOG_LEVEL_APP:INFO}
    io.micronaut: ${LOG_LEVEL_MICRONAUT:INFO}

auth:
  jwt:
    issuer: ${AUTH_JWT_ISSUER:https://auth.posadskiy.com}
    audience: ${AUTH_JWT_AUDIENCE:api.posadskiy.com}
    access-token-ttl: ${AUTH_JWT_ACCESS_TTL:PT15M}
    hmac-secret: ${AUTH_JWT_HMAC_SECRET:${JWT_GENERATOR_SIGNATURE_SECRET}}
    private-key-pem: ${AUTH_JWT_PRIVATE_KEY_PEM:}
    public-key-pem: ${AUTH_JWT_PUBLIC_KEY_PEM:}
  password:
    bcrypt-cost: ${AUTH_BCRYPT_COST:10}
  token:
    refresh-token-ttl: ${AUTH_REFRESH_TTL:P30D}
  rate-limit:
    login-per-minute: ${AUTH_LOGIN_RATE:20}
    window: PT1M
  oauth:
    redirect-base-url: ${OAUTH_REDIRECT_BASE_URL:http://localhost:8100}
    frontend-redirect-url: ${OAUTH_FRONTEND_REDIRECT_URL:}
    state-ttl: PT10M
    login-code-ttl: PT5M
    providers:
      google:
        enabled: ${GOOGLE_OAUTH_ENABLED:true}
        client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
        client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
        authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
        token-uri: https://oauth2.googleapis.com/token
        jwks-uri: https://www.googleapis.com/oauth2/v3/certs
        issuer: https://accounts.google.com
        redirect-uri: ${OAUTH_REDIRECT_BASE_URL:http://localhost:8100}/oauth2/callback/google
        pkce-required: true
        scopes:
          - openid
          - email
          - profile
      apple:
        enabled: ${APPLE_OAUTH_ENABLED:false}
        client-id: ${APPLE_OAUTH_CLIENT_ID:}
        client-secret: ${APPLE_OAUTH_CLIENT_SECRET:}
        authorization-uri: https://appleid.apple.com/auth/authorize
        token-uri: https://appleid.apple.com/auth/token
        jwks-uri: https://appleid.apple.com/auth/keys
        issuer: https://appleid.apple.com
        redirect-uri: ${OAUTH_REDIRECT_BASE_URL:http://localhost:8100}/oauth2/callback/apple
        pkce-required: true
        apple-team-id: ${APPLE_OAUTH_TEAM_ID:}
        apple-key-id: ${APPLE_OAUTH_KEY_ID:}
        apple-private-key-pem: ${APPLE_OAUTH_PRIVATE_KEY_PEM:}
        scopes:
          - openid
          - email
          - name
  clients:
    system:
      enabled: ${SYSTEM_CLIENT_ENABLED:false}
      client-id: ${SYSTEM_CLIENT_ID:system}
      client-secret: ${SYSTEM_CLIENT_SECRET:}
      roles:
        - ROLE_SERVICE
