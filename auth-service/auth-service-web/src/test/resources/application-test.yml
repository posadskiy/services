micronaut:
  application:
    name: auth-service
  server:
    port: -1
    thread-selection: AUTO
  security:
    authentication: bearer
    intercept-url-map:
      - pattern: /login
        access: isAnonymous()
      - pattern: /users
        access: isAnonymous()
      - pattern: /signup
        access: isAnonymous()
      - pattern: /oauth/token
        access: isAnonymous()
      - pattern: /oauth/revoke
        access: isAnonymous()
      - pattern: /logout
        access: isAnonymous()
      - pattern: /oauth2/**
        access: isAnonymous()
      - pattern: /keys
        access: isAnonymous()
      - pattern: /.well-known/**
        access: isAnonymous()
      - pattern: /health/**
        access: isAnonymous()
      - pattern: /swagger-ui/**
        access: isAnonymous()
      - pattern: /swagger/**
        access: isAnonymous()
    endpoints:
      login:
        enabled: false
      logout:
        enabled: false
      oauth:
        enabled: false
      keys:
        enabled: true
    token:
      jwt:
        claims-validators:
          issuer: https://auth.test
          audience: api.test
        generator:
          access-token:
            expiration: 900
          refresh-token:
            enabled: false
  metrics:
    enabled: false
  tracing:
    opentelemetry:
      enabled: false
  endpoints:
    prometheus:
      enabled: false
    health:
      enabled: true
      sensitive: false

otel:
  traces:
    exporter: none

flyway:
  datasources:
    default:
      enabled: true
      baseline-on-migrate: false

datasources:
  default:
    driver-class-name: org.postgresql.Driver
    schema-generate: NONE
    dialect: POSTGRES

auth:
  jwt:
    issuer: https://auth.test
    audience: api.test
    hmac-secret: test-hmac-secret-key-must-be-at-least-32-bytes
  password:
    bcrypt-cost: 4
  oauth:
    redirect-base-url: http://localhost:8100
    frontend-redirect-url: ""
    allowed-frontend-redirect-urls: https://repeaty.posadskiy.com/oauth/callback,https://costy.posadskiy.com/oauth/callback,https://grammarbar.com/oauth/callback,capacitor://localhost/oauth/callback,costy://oauth/callback
    providers:
      google:
        enabled: true
        client-id: test-google-client
        client-secret: test-google-secret
        authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
        token-uri: https://oauth2.googleapis.com/token
        jwks-uri: https://www.googleapis.com/oauth2/v3/certs
        issuer: https://accounts.google.com
        redirect-uri: http://localhost:8100/oauth2/callback/google
  clients:
    system:
      enabled: true
      client-id: system
      client-secret: system-secret
      roles:
        - ROLE_SERVICE

logging:
  level:
    root: WARN
    com.posadskiy.auth: INFO
