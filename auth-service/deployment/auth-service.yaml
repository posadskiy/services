apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: microservices
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/prometheus"
        prometheus.io/port: "8100"
    spec:
      imagePullSecrets:
      - name: dockerhub-registry-secret
      containers:
      - name: auth-service
        image: ${DOCKERHUB_USERNAME}/auth-service:${IMAGE_VERSION}
        imagePullPolicy: Always
        ports:
        - containerPort: 8100
        env:
        - name: MICRONAUT_ENVIRONMENTS
          value: "prod"
        - name: DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: microservices-config
              key: AUTH_DATABASE_URL
        - name: DATASOURCE_USERNAME
          valueFrom:
            configMapKeyRef:
              name: microservices-config
              key: AUTH_DATABASE_USER
        - name: DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: microservices-secrets
              key: AUTH_DATABASE_PASSWORD
        - name: JWT_GENERATOR_SIGNATURE_SECRET
          valueFrom:
            secretKeyRef:
              name: microservices-secrets
              key: JWT_GENERATOR_SIGNATURE_SECRET
        - name: OAUTH_REDIRECT_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: microservices-config
              key: OAUTH_REDIRECT_BASE_URL
        - name: OAUTH_FRONTEND_REDIRECT_URL
          valueFrom:
            configMapKeyRef:
              name: microservices-config
              key: OAUTH_FRONTEND_REDIRECT_URL
              optional: true
        - name: GOOGLE_OAUTH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: microservices-secrets
              key: GOOGLE_OAUTH_CLIENT_ID
        - name: GOOGLE_OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: microservices-secrets
              key: GOOGLE_OAUTH_CLIENT_SECRET
        - name: APPLE_OAUTH_ENABLED
          value: "false"
        - name: SYSTEM_CLIENT_ENABLED
          value: "true"
        - name: SYSTEM_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: microservices-secrets
              key: SYSTEM_CLIENT_ID
              optional: true
        - name: SYSTEM_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: microservices-secrets
              key: SYSTEM_CLIENT_SECRET
              optional: true
        - name: AUTH_JWT_HMAC_SECRET
          valueFrom:
            secretKeyRef:
              name: microservices-secrets
              key: JWT_GENERATOR_SIGNATURE_SECRET
        - name: OTEL_SERVICE_NAME
          value: "auth-service"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://grafana-alloy.observability.svc.cluster.local:4317"
        - name: OTEL_TRACES_SAMPLER
          value: parentbased_traceidratio
        - name: OTEL_TRACES_SAMPLER_ARG
          value: "0.1"
        - name: DB_MAX_POOL_SIZE
          value: "3"
        - name: DB_MIN_IDLE
          value: "0"
        - name: DB_IDLE_TIMEOUT
          value: "60000"
        - name: DB_MAX_LIFETIME
          value: "600000"
        - name: DATASOURCES_DEFAULT_HIKARI_MAXIMUM_POOL_SIZE
          value: "3"
        - name: DATASOURCES_DEFAULT_HIKARI_MINIMUM_IDLE
          value: "0"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        startupProbe:
          httpGet:
            path: /health/liveness
            port: 8100
          failureThreshold: 30
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health/liveness
            port: 8100
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: 8100
          periodSeconds: 10
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: microservices
  labels:
    app: auth-service
spec:
  type: ClusterIP
  ports:
  - port: 8100
    targetPort: 8100
    protocol: TCP
  selector:
    app: auth-service 
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service-external
  namespace: microservices
  labels:
    app: auth-service-external
spec:
  type: ExternalName
  externalName: auth-service.microservices.svc.cluster.local
  ports:
  - port: 8100
    protocol: TCP 
